[package]
name = "zkboo-ecc"
version = "1.3.0"
edition = "2024"
description = "Elliptic curve cryptography primitives for the ZKBoo ecosystem."
license = "LGPL-3.0-or-later"
documentation = "https://docs.rs/zkboo-ecc"
repository = "https://github.com/zkboo/zkboo-ecc"
keywords = ["zk", "zero-knowledge", "zkboo"]
categories = ["cryptography", "no-std"]

[dependencies]
zkboo = { version = "1.3.0", features = ["u64"] }
zkboo-modular = "1.3.0"
zeroize = { version = "1.8.2", default-features = false }

[dev-dependencies]
zkboo = { version = "1.3.0", features = ["u64"] }
zkboo-profiling = "1.3.0"
zkboo-circuit-hash = "1.3.0"
dashu-int = "0.4"
blake3 = "1.8.3"
