[package]
name = "zkboo-ecc"
version = "1.2.0"
edition = "2024"
description = "Elliptic curve cryptography primitives for the ZKBoo ecosystem."
license = "LGPL-3.0-or-later"
documentation = "https://docs.rs/zkboo-ecc"
repository = "https://github.com/zkboo/zkboo-ecc"
keywords = ["zk", "zero-knowledge", "zkboo"]
categories = ["cryptography", "no-std"]

[dependencies]
zkboo = { version = "1.3.0", features = ["u64"] }
zkboo-modular = "1.3.0"

[dev-dependencies]
zkboo = { version = "1.3.0", features = ["u64", "keccak"] }
zkboo-profiling = "1.2.0"
dashu-int = "0.4"
